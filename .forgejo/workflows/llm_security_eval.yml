name: LLM Security Evaluator CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'   # Weekly every Monday at 00:00 UTC
  push:
    branches: [ main, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  eval-tests:
    name: Run LLM Security & Substitution Tests
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GUARD_LLM_MODEL: "gpt-5.6-luna"
      GUARD_REASONING_EFFORT: "low"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify No Residual Git Conflict Markers
        run: |
          if grep -rnE '^(<{7}|>{7}|={7}) ' --exclude-dir=.git .; then
            echo "❌ Git conflict markers detected in repository!"
            exit 1
          fi

      - name: Ensure ShellCheck Binary
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "📥 Downloading standalone shellcheck binary for CI runner..."
            mkdir -p "$HOME/.local/bin"
            ARCH=$(uname -m)
            if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
              SC_ARCH="aarch64"
            else
              SC_ARCH="x86_64"
            fi
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.${SC_ARCH}.tar.xz" | tar -xJ -C /tmp
            cp "/tmp/shellcheck-v0.10.0/shellcheck" "$HOME/.local/bin/"
            chmod +x "$HOME/.local/bin/shellcheck"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
            export PATH="$HOME/.local/bin:$PATH"
          fi
          shellcheck --version

      - name: Verify Environment
        run: |
          python3 --version
          git --version
          shellcheck --version || true

      - name: Run Unit Guardrail Tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m unittest discover -s tests -v

      - name: Run Live LLM Integration Tests (OpenAI-compatible cloud judge)
        run: |
          if [ -n "${OPENAI_API_KEY}" ]; then
            python3 -m unittest tests/test_llm_evaluator_integration.py
          else
            echo "ℹ️  OPENAI_API_KEY secret not set; skipping live integration tests in CI."
          fi
