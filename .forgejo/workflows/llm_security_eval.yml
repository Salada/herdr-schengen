name: LLM Security Evaluator CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'   # Weekly every Monday at 00:00 UTC
  push:
    branches: [ main, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  eval-tests:
    name: Run LLM Security & Substitution Tests
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GUARD_LLM_ENDPOINT: "https://api.deepseek.com/v1/chat/completions"
      GUARD_LLM_MODEL: "deepseek-chat"
      GUARD_REASONING_EFFORT: "low"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          python3 --version
          git --version

      - name: Run Unit Guardrail Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Run Live LLM Integration Tests (DeepSeek)
        run: |
          if [ -n "${DEEPSEEK_API_KEY}" ]; then
            python3 -m unittest tests/test_llm_evaluator_integration.py
          else
            echo "ℹ️  DEEPSEEK_API_KEY secret not set; skipping live integration tests in CI."
          fi
