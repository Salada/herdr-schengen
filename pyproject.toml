[project]
name = "herdr-schengen"
version = "0.1.0"
description = "Herdr Schengen (SmartGate) Trusted Clearance gatekeeper"
requires-python = ">=3.9"
# Declared required dependencies (SSOT): semgrep is the SAST pre-filter core and
# must be present in the runtime venv — the daemon's host-runtime gate hard-fails
# at startup when the `semgrep` CLI is missing (INV-2 fail-closed).
dependencies = [
    "semgrep>=1.70.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".git", ".worktrees", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests add the scripts/ dir to sys.path before importing (no installed package).
"tests/*.py" = ["E402"]
# Standalone entry points add scripts/ to sys.path before importing subpackages.
"scripts/cmd/*.py" = ["E402"]

[tool.black]
line-length = 120
target-version = ["py39"]
